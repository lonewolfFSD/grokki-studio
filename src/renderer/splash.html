<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grokki Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Plus Jakarta Sans", sans-serif;
      -webkit-app-region: drag;
    }

    .splash-card {
      position: relative;
      width: 380px;
      height: 330px;
      border-radius: 24px;
      background: radial-gradient(circle at 50% 25%, rgba(24, 27, 42, 0.96) 0%, rgba(10, 11, 16, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.85), 0 0 50px rgba(56, 189, 248, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px 28px;
      cursor: default;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Ambient Pulsing Aura behind the logo */
    .aura-glow {
      position: absolute;
      top: 52px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(99, 102, 241, 0.2) 48%, transparent 72%);
      filter: blur(14px);
      pointer-events: none;
      animation: auraPulse 2.4s ease-in-out infinite;
    }

    @keyframes auraPulse {
      0% {
        transform: scale(0.9);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.15);
        opacity: 1;
      }
      100% {
        transform: scale(0.9);
        opacity: 0.6;
      }
    }

    /* Logo Container with Rhythmic Heartbeat Pulse */
    .logo-wrap {
      position: relative;
      width: 104px;
      height: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      z-index: 2;
    }

    .logo-img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(56, 189, 248, 0.45));
      animation: logoPulse 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes logoPulse {
      0% {
        transform: scale(0.96);
        filter: drop-shadow(0 6px 18px rgba(56, 189, 248, 0.35));
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 12px 34px rgba(56, 189, 248, 0.7)) drop-shadow(0 0 16px rgba(129, 140, 248, 0.55));
      }
      100% {
        transform: scale(0.96);
        filter: drop-shadow(0 6px 18px rgba(56, 189, 248, 0.35));
      }
    }

    /* Studio Wordmark Title */
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
      z-index: 2;
    }

    /* Sleek Loading Track & Moving Beam */
    .loading-track {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
      z-index: 2;
    }

    .loading-beam {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 60%;
      background: linear-gradient(90deg, transparent 0%, #38bdf8 50%, #818cf8 80%, transparent 100%);
      border-radius: 999px;
      animation: beamMove 1.4s ease-in-out infinite;
    }

    @keyframes beamMove {
      0% {
        left: -65%;
      }
      100% {
        left: 105%;
      }
    }

    /* Subtle Status Message */
    .status-text {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.01em;
      font-weight: 500;
      white-space: nowrap;
      z-index: 2;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>
  <div class="splash-card" id="splashCard">
    <div class="aura-glow"></div>
    <div class="logo-wrap">
      <img src="./grokki_logo.png" alt="Grokki Studio" class="logo-img" />
    </div>
    <div class="title">Grokki Studio</div>
    <div class="loading-track">
      <div class="loading-beam" id="loadingBeam"></div>
    </div>
    <span class="status-text" id="statusText">Loading Grokki Studio...</span>
  </div>

  <script>
    const splashCard = document.getElementById('splashCard');
    const statusText = document.getElementById('statusText');
    const loadingBeam = document.getElementById('loadingBeam');

    let finished = false;
    let appIsReady = false;
    const startTime = Date.now();
    const MIN_DISPLAY_MS = 850; // Graceful minimum display so animation is seen smoothly

    function finish() {
      if (finished) return;
      finished = true;

      if (loadingBeam) {
        loadingBeam.style.animation = 'none';
        loadingBeam.style.left = '0';
        loadingBeam.style.width = '100%';
        loadingBeam.style.background = '#38bdf8';
      }
      if (statusText) {
        statusText.textContent = 'Ready';
        statusText.style.color = '#38bdf8';
      }

      splashCard.style.opacity = '0';
      splashCard.style.transform = 'scale(0.96)';

      setTimeout(() => {
        if (window.jarvisAPI && window.jarvisAPI.notifySplashFinished) {
          window.jarvisAPI.notifySplashFinished();
        } else {
          window.close();
        }
      }, 260);
    }

    function checkReadyToFinish() {
      if (!appIsReady) return;
      const elapsed = Date.now() - startTime;
      if (elapsed >= MIN_DISPLAY_MS) {
        finish();
      } else {
        setTimeout(finish, MIN_DISPLAY_MS - elapsed);
      }
    }

    // Listen for the app ready event from main process when dashboard is fully loaded
    if (window.jarvisAPI && window.jarvisAPI.onAppReady) {
      window.jarvisAPI.onAppReady(() => {
        appIsReady = true;
        checkReadyToFinish();
      });
    }

    // Maximum fallback timer (3.5s) to guarantee splash screen never hangs
    const maxTimer = setTimeout(() => {
      appIsReady = true;
      finish();
    }, 3500);

    // Click anywhere to fast-forward
    document.body.addEventListener('click', () => {
      clearTimeout(maxTimer);
      finish();
    });
  </script>
</body>
</html>
